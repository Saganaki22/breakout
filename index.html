<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout</title>
  <meta name="description" content="Play Breakout, a dopamine-heavy browser arcade game with evolving brick layouts, powerups, ball chaos, and dynamic difficulty.">
  <meta name="theme-color" content="#050608">
  <link rel="canonical" href="https://drbaph.is-a.dev/breakout">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://drbaph.is-a.dev/breakout">
  <meta property="og:title" content="Breakout">
  <meta property="og:description" content="A fast 16:9 browser Breakout game with evolving ages, powerups, ball storms, and dynamic difficulty.">
  <meta property="og:image" content="https://drbaph.is-a.dev/breakout/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Breakout">
  <meta name="twitter:description" content="A fast 16:9 browser Breakout game with evolving ages, powerups, ball storms, and dynamic difficulty.">
  <meta name="twitter:image" content="https://drbaph.is-a.dev/breakout/og-image.svg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.svg">
  <script type="module" crossorigin src="./assets/index-BMOlSWjQ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DJ9I3O5J.css">
</head>
<body>
  <main class="game-shell">
    <section class="score-strip" aria-label="Score">
      <div class="score-card">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
    </section>

    <aside class="hud hud-left" aria-label="Run status">
      <div>
        <span>Combo</span>
        <strong id="combo">x1</strong>
        <div class="combo-meter" aria-hidden="true"><i id="comboFill"></i></div>
      </div>
      <div>
        <span>Balls</span>
        <strong id="balls">0</strong>
      </div>
      <div>
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
    </aside>

    <aside class="hud hud-right" aria-label="Level status">
      <div>
        <span>Age</span>
        <strong id="level">1</strong>
      </div>
      <div>
        <span>Objective</span>
        <strong id="objective">Core</strong>
        <div class="objective-meter" aria-hidden="true"><i id="objectiveFill"></i></div>
      </div>
      <a class="icon-link github-link" href="https://github.com/Saganaki22/breakout" target="_blank" rel="noopener noreferrer" aria-label="Open Breakout on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48l-.01-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.14-1.1-1.45-1.1-1.45-.9-.61.07-.6.07-.6 1 .07 1.52 1.03 1.52 1.03.88 1.51 2.31 1.07 2.87.82.09-.64.35-1.07.63-1.32-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.02c.85 0 1.7.11 2.5.34 1.9-1.3 2.74-1.03 2.74-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86l-.01 2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
        </svg>
      </a>
    </aside>

    <div class="stage-wrap">
      <canvas id="game" width="1600" height="900" aria-label="Breakout game canvas"></canvas>
      <div id="overlay" class="overlay">
        <h1>Breakout</h1>
        <p>Break bricks, chain multipliers, split balls, and survive shifting themed ages.</p>
        <div id="choicePanel" class="choice-panel" hidden></div>
        <button id="startBtn" type="button">Start</button>
      </div>
    </div>

    <section class="controls" aria-label="Game controls">
      <button id="pauseBtn" type="button">Pause</button>
      <button id="launchBtn" type="button">Launch</button>
      <button id="muteBtn" type="button">Sound On</button>
    </section>
  </main>

</body>
</html>
